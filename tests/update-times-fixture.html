<!doctype html><meta charset="utf-8"><title>最近更新安全夹具</title><style>body{font:16px sans-serif;padding:30px}img{width:70px;height:70px}section{padding:16px;border:1px solid #ddd;margin:15px}</style><h1>最近更新排序 · 无网络写入夹具</h1><div id="result"></div><script>const S={assets:[],iconSort:'name-desc',assetSort:'oldest',librarySort:'updated-desc'};const escC=String;const collatorC=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
function timeC(value){const n=Date.parse(value||'');return Number.isFinite(n)?n:null;}
function compareTimedC(a,b,field,direction){const read=o=>field==='latest'?(timeC(o.updatedAt)??timeC(o.addedAt)??timeC(o.createdAt)):timeC(o[field]);const x=read(a),y=read(b);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;return x===y?0:direction*(x-y);}
function sortedAssetsC(items,mode=S.assetSort){return [...items].sort((a,b)=>mode==='name-asc'?collatorC.compare(a.name,b.name):mode==='name-desc'?collatorC.compare(b.name,a.name):compareTimedC(a,b,mode==='oldest'?'createdAt':'latest',mode==='oldest'?1:-1)||collatorC.compare(a.path,b.path));}
function sortedLibrariesC(items,mode=S.librarySort){return [...items].sort((a,b)=>mode==='name-asc'?collatorC.compare(a.name,b.name):mode==='name-desc'?collatorC.compare(b.name,a.name):compareTimedC(a,b,'latest',mode==='updated-asc'?1:-1)||collatorC.compare(a.file,b.file));}
function sortedIconsC(lib,items,mode=S.iconSort){return [...items].sort((a,b)=>mode==='name-asc'?collatorC.compare(a.name,b.name):mode==='name-desc'?collatorC.compare(b.name,a.name):compareTimedC(a,b,mode==='oldest'?'addedAt':'latest',mode==='oldest'?1:-1)||(a.index-b.index));}
function closeSortMenus(restoreFocus=false){window.AnchoredMenu.close(restoreFocus);}
function sortSelectC(kind,value,options){const current=options.find(([v])=>v===value)?.[1]||options[0]?.[1]||'';return `<div class="sort-control" data-sort-menu="${kind}"><span>排序</span><button type="button" class="sort-trigger" data-action="toggle-sort" aria-haspopup="menu" aria-expanded="false">${escC(current)} <b aria-hidden="true">${uiIconC('chevron')}</b></button><div class="sort-menu" role="menu">${options.map(([v,l])=>`<button type="button" role="menuitemradio" aria-checked="${value===v}" class="sort-option ${value===v?'active':''}" data-action="choose-sort" data-sort-kind="${kind}" data-sort-value="${v}">${value===v?'<span aria-hidden="true">✓</span>':'<span aria-hidden="true"></span>'}${escC(l)}</button>`).join('')}</div></div>`;}
function imageURLC(item){const asset=item.sha?item:S.assets.find(a=>a.url===item.url);if(!asset?.sha)return item.url;try{const url=new URL(item.url);url.searchParams.set('v',asset.sha);return url.href;}catch{return item.url;}}
function coverStack(lib) { const list=sortedIconsC(lib,(lib.icons||[]).map((item,index)=>({...item,index})),'newest').slice(0,3); return `<div class="library-preview-strip" aria-hidden="true">${list.length?list.map(x=>`<span class="library-preview-tile"><img src="${escC(imageURLC(x))}" alt="" onerror="this.closest('.library-preview-tile').classList.add('broken');this.remove()"></span>`).join(''):'<span class="library-row-icon">▦</span>'}</div>`; }

const icons=[{"name":"A","url":"https://example.invalid/a","addedAt":"2020-01-01","updatedAt":"2026-09-01","index":0},{"name":"B","url":"https://example.invalid/b","addedAt":"2025-01-01","index":1},{"name":"C","url":"https://example.invalid/c","addedAt":"2026-01-01","index":2},{"name":"D","url":"https://example.invalid/d","addedAt":"2026-09-02","index":3},{"name":"unknown","url":"https://example.invalid/u","index":4}];for(const i of icons)i.url='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70"><rect width="70" height="70" fill="lightblue"/><text x="15" y="40">'+i.name+'</text></svg>');const lib={icons};document.getElementById('result').innerHTML=['newest','oldest','name-asc','name-desc'].map(mode=>{S.iconSort=mode;return '<section><h2>UI '+mode+'</h2>封面应始终 D / A / C'+coverStack(lib)+'<p>库顺序：'+sortedIconsC(lib,icons).map(i=>i.name+' [原索引 '+i.index+']').join(' → ')+'</p></section>'}).join('');</script>
