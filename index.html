<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1729" />
  <title>GitHub 图床</title>
  <link rel="stylesheet" href="styles.css?v=overview-compact-61" />
  <link rel="stylesheet" href="console.css?v=overview-compact-61" />
  <link rel="stylesheet" href="ui-refresh.css?v=overview-compact-61" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-copy"><strong>GitHub Assets</strong></div>
        <button class="sidebar-close" data-action="toggle-sidebar" aria-label="收起侧栏">×</button>
      </div>

      <div class="repo-switcher" data-action="open-repo" role="button" tabindex="0" aria-label="打开当前仓库">
        <span class="repo-avatar">B</span>
        <span class="repo-meta"><small class="repo-label">当前仓库</small><b id="repoName"><span class="repo-name-text">未选择仓库</span><i class="repo-status-dot" id="storageDot" title="仓库未连接"></i></b><small id="repoOwner">登录后自动识别</small></span>
        <svg class="repo-open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5m-1-4-7 7m5 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/></svg>
      </div>

      <nav class="main-nav">
        <div class="nav-label">工作台</div>
        <button class="nav-item active" data-view="overview"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></span><span>总览</span></button>
        <button class="nav-item" data-view="assets"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM7 15l3-3 2 2 2-2 3 3"/><circle cx="9" cy="9" r="1"/></svg></span><span>图片资源</span><em class="nav-count" id="assetCount">126</em></button>
        <button class="nav-item" data-view="libraries"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM8 8h8m-8 4h8m-8 4h5"/></svg></span><span>JSON 库</span><em class="nav-count" id="libraryCount">2</em></button>
        <div class="nav-label nav-label-gap">管理</div>
        <button class="nav-item" data-view="activity"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span><span>同步记录</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon"><svg style="transform:scale(.84)" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span>仓库设置</span></button>
        <button class="nav-item" data-view="admin"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-3.2 2.8-5 7-5s6.4 1.8 7 5"/></svg></span><span>管理后台</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="user-chip"><div class="user-avatar" data-account-avatar>B</div><div><b data-account-name>GitHub 用户</b></div><button type="button" class="more" data-action="account-menu" aria-label="账号菜单">•••</button></div>
      </div>
    </aside>

    <button type="button" class="sidebar-overlay" data-action="toggle-sidebar" aria-label="关闭侧栏"></button>

    <div class="main-shell">
      <header class="topbar">
        <button class="mobile-menu" data-action="toggle-sidebar">☰</button>
        <div class="top-title"><span class="eyebrow" id="pageEyebrow">资源工作台</span><h1 id="pageTitle">总览</h1></div>
        <div class="top-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" placeholder="搜索 JSON 库、图片或文件…" autocomplete="off" /><kbd>⌘ K</kbd></label>
          <button class="top-icon appearance-button" data-action="toggle-theme" title="跟随系统（点击切换）" aria-label="跟随系统（点击切换）">◐</button>
          <button class="top-icon github-repo-link" data-action="open-project" title="打开项目源码仓库" aria-label="打开项目源码仓库"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.3a9.7 9.7 0 0 0-3.07 18.9c.49.09.67-.21.67-.47v-1.66c-2.73.59-3.31-1.16-3.31-1.16-.44-1.13-1.08-1.43-1.08-1.43-.89-.61.07-.6.07-.6.98.07 1.5 1.01 1.5 1.01.87 1.5 2.28 1.07 2.84.82.09-.63.34-1.07.62-1.32-2.18-.25-4.47-1.09-4.47-4.85 0-1.07.38-1.94 1.01-2.62-.1-.25-.44-1.25.1-2.59 0 0 .82-.26 2.67 1a9.3 9.3 0 0 1 4.86 0c1.85-1.26 2.67-1 2.67-1 .54 1.34.2 2.34.1 2.59.63.68 1.01 1.55 1.01 2.62 0 3.77-2.3 4.59-4.48 4.84.35.3.66.9.66 1.81v2.68c0 .26.18.57.68.47A9.7 9.7 0 0 0 12 2.3Z"/></svg></button>
        </div>
      </header>
      <main id="app" class="content"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <script src="github.js?v=external-sync-3"></script>
  <script src="vendor/floating-ui/core-1.8.0.umd.min.js"></script>
  <script src="vendor/floating-ui/dom-1.8.0.umd.min.js"></script>
  <script src="popup.js?v=ui-refresh-25-stat-spacing"></script>
  <script src="console.js?v=overview-compact-61"></script>
</body>
</html>
